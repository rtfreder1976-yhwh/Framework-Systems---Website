<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Footer — Framework Systems</title>
<link rel="stylesheet" href="../_tokens.css">
<style>
  .footer { background: var(--navy); color: rgba(255,255,255,0.72); padding: 34px 32px 42px; }
  .footer-inner { display: flex; justify-content: space-between; gap: 24px; align-items: center; flex-wrap: wrap; }
  .brand { color: var(--white); font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; text-decoration: none; }
  .brand span { color: var(--accent); }
  .footer-copy { font-family: 'DM Mono', monospace; font-size: 0.74rem; letter-spacing: 0.08em; line-height: 1.8; }
  .footer-nav { display: flex; flex-wrap: wrap; gap: 18px; }
  .footer-nav a { text-decoration: none; color: rgba(255,255,255,0.72); font-family: 'DM Sans', sans-serif; font-size: 0.92rem; }
  .footer-nav a:hover { color: var(--white); }
</style>
</head>
<body>
<div class="ds-stage ds-stage--dark" style="padding:0">
  <footer class="footer">
    <div class="footer-inner">
      <div>
        <a class="brand">Framework<span>.</span></a>
        <p class="footer-copy">© 2026 Framework Systems LLC · Tuscumbia, Alabama<br>Veteran-Owned · Faith-Driven · Built for Service Businesses</p>
      </div>
      <nav class="footer-nav">
        <a>Services</a><a>Industries</a><a>Case Study</a><a>How It Works</a><a>About</a><a>Contact</a>
      </nav>
    </div>
  </footer>
</div>
</body>
</html>
